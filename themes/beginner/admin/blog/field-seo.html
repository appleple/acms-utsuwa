<h3 class="acms-admin-admin-title2">SEO設定</h3>
<table class="adminTable acms-admin-table-admin-edit">
  <tr>
    <th><label for="input-text-blog_meta_title">タイトル</label><i data-acms-tooltip="検索結果やブラウザのタブに表示されるページのタイトル（title タグ）で、ブログ名の代わりに使う文字を設定します。このブログのすべてのページに使われます。" class="acms-admin-icon-tooltip js-acms-tooltip-hover"></i>
      <div>
        <span class="acms-admin-label"><span class="keyword_countup"></span> 文字</span>
      </div>
    </th>
    <td>
      <input type="text" name="blog_meta_title" value="{blog_meta_title}" id="input-text-blog_meta_title" class="js-countup acms-admin-form-width-large" data-max="99999" data-label-target=".keyword_countup" />
      <input type="hidden" name="field[]" value="blog_meta_title" />
      <input type="hidden" name="blog_meta_title:search" value="0" />
    </td>
  </tr>
  <!-- キーワード（keywords）は現在の主要な検索エンジンで使われていないため非表示にしている。使う場合は、このコメントを外し、include/head/meta.html の keywords の出力も戻す
  <tr>
    <th><label for="input-text-blog_meta_keywords">キーワード - <small>keywords</small></label><i data-acms-tooltip="ブログの METAタグ（Keywords）を設定します。" class="acms-admin-icon-tooltip js-acms-tooltip-hover"></i></th>
    <td>
      <input type="text" name="blog_meta_keywords" value="{blog_meta_keywords}" id="input-text-blog_meta_keywords" class="acms-admin-form-width-full" />
      <input type="hidden" name="field[]" value="blog_meta_keywords" />
      <input type="hidden" name="blog_meta_keywords:search" value="0" />
    </td>
  </tr>
  -->
  <tr>
    <th><label for="input-text-blog_meta_description">概要文</label><i data-acms-tooltip="検索結果や、SNS でシェアされたときに表示される、ページの説明文（meta description・og:description）を設定します。" class="acms-admin-icon-tooltip js-acms-tooltip-hover"></i>
      <div>
        <span class="acms-admin-label"><span class="description_countup"></span> 文字</span>
      </div>
    </th>
    <td>
      <textarea name="blog_meta_description" rows="5" id="input-text-blog_meta_description" class="js-countup acms-admin-form-width-full acms-admin-form-auto-size" style="--acms-admin-form-control-min-height: 3lh;" data-max="99999" data-label-target=".description_countup">{blog_meta_description}</textarea>
      <input type="hidden" name="field[]" value="blog_meta_description" />
      <input type="hidden" name="blog_meta_description:search" value="0" />
    </td>
  </tr>
  <tr>
    <th>検索エンジン<i data-acms-tooltip="チェックすると、このブログのトップページと、カテゴリーに属さない一覧ページを検索結果に表示しないよう検索エンジンに伝えます（noindex）。カテゴリーやエントリーのページは、それぞれで設定します。" class="acms-admin-icon-tooltip js-acms-tooltip-hover"></i></th>
    <td>
      <div class="acms-admin-form-checkbox">
        <input type="checkbox" name="blog_meta_robots[]" value="noindex"{blog_meta_robots:checked#noindex} id="input-checkbox-blog-meta-robots" />
        <label for="input-checkbox-blog-meta-robots"><i class="acms-admin-ico-checkbox"></i>このコンテンツを検索エンジンに登録しない</label>
      </div>
      <input type="hidden" name="field[]" value="blog_meta_robots" />
    </td>
  </tr>
  <tr>
    <th>サイトマップ<i data-acms-tooltip="チェックすると、このブログのページ（カテゴリー・エントリーを含む）をサイトマップ（sitemap.xml）に載せません。子ブログは含みません。" class="acms-admin-icon-tooltip js-acms-tooltip-hover"></i></th>
    <td>
      <div class="acms-admin-form-checkbox">
        <input type="checkbox" name="blog_meta_sitemap[]" value="disabled"{blog_meta_sitemap:checked#disabled} id="input-checkbox-blog-meta-sitemap" />
        <label for="input-checkbox-blog-meta-sitemap">
          <i class="acms-admin-ico-checkbox"></i>このコンテンツをサイトマップ( sitemap.xml )に表示しない
        </label>
      </div>
      <input type="hidden" name="field[]" value="blog_meta_sitemap" />
    </td>
  </tr>
  <tr>
    <th>RSS<i data-acms-tooltip="チェックすると、このブログのエントリーを RSS（rss2.xml）に載せません。子ブログのエントリーは含みません。" class="acms-admin-icon-tooltip js-acms-tooltip-hover"></i></th>
    <td>
      <div class="acms-admin-form-checkbox">
        <input type="checkbox" name="blog_meta_rss[]" value="disabled"{blog_meta_rss:checked#disabled} id="input-checkbox-blog-meta-rss" />
        <label for="input-checkbox-blog-meta-rss">
          <i class="acms-admin-ico-checkbox"></i>このコンテンツをRSS(rss2.xml)に表示しない
        </label>
      </div>
      <input type="hidden" name="field[]" value="blog_meta_rss" />
    </td>
  </tr>
</table>
