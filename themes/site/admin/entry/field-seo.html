<details class="acms-admin-accordion">
  <summary class="acms-admin-accordion-button">
    <span id="seo-entry-accordion-title"><!--T-->メイン画像・SEO設定<!--/T--></span>
    <span class="acms-admin-icon-arrow-small-down acms-admin-margin-left-mini" aria-hidden="true"></span>
  </summary>
  <div class="acms-admin-accordion-panel">
    <table class="adminTable acms-admin-table-admin-edit">
      <tr id="seo-entry_meta_title">
        <th>タイトル<i data-acms-tooltip="検索結果やブラウザのタブに表示されるページのタイトル（title タグ）で、このエントリーのタイトルの代わりに使う文字を設定します。" class="acms-admin-icon-tooltip acms-admin-inline-space-left js-acms-tooltip-hover"></i>
          <div>
            <span class="acms-admin-label"><span class="keyword_countup"></span> 文字</span>
          </div>
        </th>
        <td>
          <input type="text" name="entry_meta_title" value="{entry_meta_title}" class="js-countup acms-admin-form-width-medium" data-max="9999" data-label-target=".keyword_countup" /> | %{ROOT_BLOG_NAME}
          <input type="hidden" name="field[]" value="entry_meta_title" />
          <input type="hidden" name="entry_meta_title:search" value="0" />
        </td>
      </tr>
      <!-- キーワード（keywords）は現在の主要な検索エンジンで使われていないため非表示にしている。使う場合は、このコメントを外し、include/head/meta.html の keywords の出力も戻す
      <tr id="seo-entry_meta_keywords">
        <th>キーワード - <small>keywords</small><i data-acms-tooltip="エントリーの METAタグ（Keywords）を設定します。" class="acms-admin-icon-tooltip acms-admin-inline-space-left js-acms-tooltip"></i></th>
        <td>
          <input type="text" name="entry_meta_keywords" value="{entry_meta_keywords}" class="acms-admin-form-width-full" />
          <input type="hidden" name="field[]" value="entry_meta_keywords" />
          <input type="hidden" name="entry_meta_keywords:search" value="0" />
        </td>
      </tr>
      -->
      <tr id="seo-entry_meta_description">
        <th>概要文<i data-acms-tooltip="検索結果や、SNS でシェアされたときに表示される、ページの説明文（meta description・og:description）を設定します。" class="acms-admin-icon-tooltip acms-admin-inline-space-left js-acms-tooltip-hover"></i>
          <div>
            <span class="acms-admin-label"><span class="description_countup"></span> 文字</span>
          </div>
        </th>
        <td>
          <textarea name="entry_meta_description" rows="5" class="js-countup acms-admin-form-width-full acms-admin-form-auto-size" style="--acms-admin-form-control-min-height: 3lh;" data-max="9999" data-label-target=".description_countup">{entry_meta_description}</textarea>
          <input type="hidden" name="field[]" value="entry_meta_description" />
          <input type="hidden" name="entry_meta_description:search" value="0" />
        </td>
      </tr>
      <tr id="seo-entry_meta_robots">
        <th>検索エンジン<i data-acms-tooltip="チェックすると、このエントリーのページを検索結果に表示しないよう検索エンジンに伝えます（noindex）。" class="acms-admin-icon-tooltip acms-admin-inline-space-left js-acms-tooltip-hover"></i></th>
        <td>
          <label class="acms-admin-form-checkbox">
            <input type="checkbox" name="entry_meta_robots[]" value="noindex" {entry_meta_robots:checked#noindex} />
            <i class="acms-admin-ico-checkbox"></i>検索エンジンに表示しない
          </label>
          <input type="hidden" name="field[]" value="entry_meta_robots" />
        </td>
      </tr>
      <tr id="seo-entry_meta_sitemap">
        <th>サイトマップ<i data-acms-tooltip="チェックすると、このエントリーをサイトマップ（sitemap.xml）に載せません。" class="acms-admin-icon-tooltip acms-admin-inline-space-left js-acms-tooltip-hover"></i></th>
        <td>
          <label class="acms-admin-form-checkbox">
            <input type="checkbox" name="entry_meta_sitemap[]" value="disabled" {entry_meta_sitemap:checked#disabled} />
            <i class="acms-admin-ico-checkbox"></i>サイトマップに表示しない
          </label>
          <input type="hidden" name="field[]" value="entry_meta_sitemap" />
        </td>
      </tr>
      <tr id="seo-entry_meta_rss">
        <th>RSS<i data-acms-tooltip="チェックすると、このエントリーを RSS（rss2.xml）に載せません。" class="acms-admin-icon-tooltip acms-admin-inline-space-left js-acms-tooltip-hover"></i></th>
        <td>
          <label class="acms-admin-form-checkbox">
            <input type="checkbox" name="entry_meta_rss[]" value="disabled" {entry_meta_rss:checked#disabled} />
            <i class="acms-admin-ico-checkbox"></i>RSSに表示しない
          </label>
          <input type="hidden" name="field[]" value="entry_meta_rss" />
        </td>
      </tr>
      <tr id="seo-entry_main_image">
        <th>メイン画像<i data-acms-tooltip="一覧表示に使う画像や、SNS でシェアされたときに表示される画像（OGP画像）を設定します。" class="acms-admin-icon-tooltip acms-admin-inline-space-left js-acms-tooltip-hover"></i></th>
        <td class="js-media-field seo-entry_main_image-droparea">
          <div class="js-droparea" data-thumbnail="{entry_main_image@thumbnail}" data-type="image" style="width:200px"></div>
          <p class="js-text acms-admin-text-danger" style="display:none">許可されていないファイルのため挿入できません。</p>
          <div class="acms-admin-margin-top-mini">
            <button type="button" class="js-insert acms-admin-btn" data-type="image">メディアを選択</button>
          </div>
          <input type="hidden" name="entry_main_image" value="{entry_main_image}" class="js-value js-block-editor-set-main-image" />
          <input type="hidden" name="field[]" value="entry_main_image" />
          <input type="hidden" name="entry_main_image:extension" value="media" />
        </td>
      </tr>
    </table>
  </div>
</details>
